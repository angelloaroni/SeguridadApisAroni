<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de soporte</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><span class="brand">Mesa de soporte</span><button id="logout" class="secondary" hidden>Cerrar sesión</button></header>
<main>
<section id="auth" class="card auth">
<h1 id="auth-title">Iniciar sesión</h1>
<form id="credentials">
<label>Usuario<input name="username" autocomplete="username" required maxlength="40"></label>
<label id="registration-name" hidden>Nombre visible<input name="displayName" maxlength="80"></label>
<label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
<button id="login">Entrar</button>
</form>
<button id="toggle" class="link">Crear una cuenta</button>
</section>
<section id="workspace" hidden>
<div class="heading"><div><h1>Mis tickets</h1><p id="identity"></p></div><button id="new-ticket">Nuevo ticket</button></div>
<div class="columns">
<aside class="card"><div class="section-head"><h2>Tickets</h2><button id="reload" class="link">Actualizar</button></div><ul id="tickets"></ul>
<details><summary>Mi perfil</summary><form id="profile"><label>Nombre visible<input name="displayName" required maxlength="80"></label><button>Guardar</button></form></details></aside>
<section class="card">
<p id="empty">Selecciona un ticket para ver la conversación.</p>
<form id="create" hidden><h2>Nuevo ticket</h2><label>Asunto<input name="subject" required maxlength="120"></label><label>Mensaje<textarea name="body" required maxlength="2000"></textarea></label><button>Crear ticket</button></form>
<div id="conversation" hidden><h2 id="subject"></h2><div id="messages"></div><form id="reply"><label>Respuesta<textarea name="body" required maxlength="2000"></textarea></label><button>Enviar</button></form></div>
</section>
</div>
</section>
<p id="status" role="status"></p>
</main>
</body></html>
